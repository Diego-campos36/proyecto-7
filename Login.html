<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CareOut</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header class="header">
    <div class="header-container">

        <div class="logo">
            <a href="index.html">
                <img src="nuevo-logo.webp" alt="Logo de CareOut">
            </a>
        </div>

        <nav class="nav" id="nav">
            <ul>
                <li><a href="ACCEDERR.html">Acceder</a></li>
                <li><a href="COMMPRAR.html">Comprar</a></li>
                <li><a href="AUTOSERVICIOO.html">Servicios</a></li>
                <li><a href="NOSOSTROS.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="hamburger" id="btn-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
</header>

<main class="logins">

<div class="login">
    <h1>Iniciar Sesión</h1>

    <form id="loginForm">

        <label for="usuario">Usuario o correo</label>
        <input type="text" id="usuario" placeholder="Usuario o correo" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" required>

        <button type="submit">Entrar</button>

        <p id="mensaje"></p>

        <p>¿No tienes cuenta?</p>
        <button type="button" onclick="window.location.href='REGISTROR.html'">Registrarse</button>
    
    </form>
</div>

</main>

<footer class="footer-pro">

    <div class="footer-top">

        <div class="footer-box">
            <h2>CareOut</h2>
            <p>Innovación en movimiento. Descubre autos que se adaptan a tu estilo de vida.</p>
        </div>

        <div class="footer-box">
            <h3>Navegación</h3>
            <ul>
                <li><a href="ACCEDERR.html">Acceder</a></li>
                <li><a href="COMMPRAR.html">Comprar</a></li>
                <li><a href="AUTOSERVICIOO.html">Servicios</a></li>
                <li><a href="NOSOSTROS.html">Contacto</a></li>
            </ul>
        </div>

        <div class="footer-box">
            <h3>Síguenos</h3>
            <div class="social-icons">
                <a href="#"><img src="facebook.png" alt="Facebook"></a>
                <a href="#"><img src="instagram.png" alt="Instagram"></a>
                <a href="#"><img src="youtube.png" alt="YouTube"></a>
            </div>
        </div>

    </div>

    <div class="footer-bottom">
        <p>&copy; 2026 CareOut | Todos los derechos reservados</p>
    </div>

</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const usuario = document.getElementById("usuario").value;
    const password = document.getElementById("password").value;

    if(usuario === "admin" && password === "1234"){
        document.getElementById("mensaje").textContent = "Login correcto";
        window.location.href = "index.html";
    } else {
        document.getElementById("mensaje").textContent = "Usuario o contraseña incorrectos";
    }
});
</script>

</body>
</html>
